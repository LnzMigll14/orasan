<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D12" />

    <!-- Search. The site URL also appears in public/robots.txt and public/sitemap.xml: change all three with a custom domain. -->
    <title>Orasan: time tracking and invoicing for Filipino freelancers</title>
    <meta
      name="description"
      content="Free time tracker and invoice maker for Filipino freelancers and virtual assistants. Track hours, send PHP or USD invoices with GCash, Maya, bank, Wise or PayPal details, and see who still owes you."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://orasan-gold.vercel.app/" />

    <!-- Link previews on Facebook, Messenger, Viber, LinkedIn and X. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orasan" />
    <meta property="og:url" content="https://orasan-gold.vercel.app/" />
    <meta property="og:title" content="Orasan: time tracking and invoicing for Filipino freelancers and VAs" />
    <meta
      property="og:description"
      content="Track your hours, send PHP or USD invoices with your GCash, Maya, bank, Wise or PayPal details, and always know how much you're owed. Free in beta."
    />
    <meta property="og:image" content="https://orasan-gold.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Orasan logo, a smiling stopwatch, beside the words: time tracking and invoicing for Filipino freelancers and VAs" />
    <meta property="og:locale" content="en_PH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orasan: time tracking and invoicing for Filipino freelancers and VAs" />
    <meta name="twitter:description" content="Track hours, send PHP or USD invoices with your local payment details, and know who still owes you." />
    <meta name="twitter:image" content="https://orasan-gold.vercel.app/og-image.png" />

    <!-- Icons and install. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Structured data for search results. A data block, not a script: the content security policy doesn't block it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Orasan",
        "url": "https://orasan-gold.vercel.app/",
        "image": "https://orasan-gold.vercel.app/og-image.png",
        "description": "Time tracking and invoicing for Filipino freelancers and virtual assistants. Track hours, send PHP or USD invoices with local payment details, and record payments.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web browser",
        "inLanguage": "en",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PHP" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Orasan is a time tracking and invoicing app for Filipino freelancers and VAs. Turn on JavaScript to use it.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
