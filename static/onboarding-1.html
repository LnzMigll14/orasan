<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D12" />
    <title>Set up Orasan · Step 1 of 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="onboarding">
      <a class="sidebar__brand" href="index.html" aria-label="Orasan">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" /></svg></span>
        <span class="brand-name">orasan</span>
      </a>
      <main class="onboarding__card">
        <ol class="stepper" aria-label="Setup steps">
          <li class="stepper__step stepper__step--current" aria-current="step"><span class="stepper__number">1</span><span class="stepper__name">Your details</span></li>
          <li class="stepper__step stepper__step--todo"><span class="stepper__number">2</span><span class="stepper__name">How you get paid</span></li>
          <li class="stepper__step stepper__step--todo"><span class="stepper__number">3</span><span class="stepper__name">First client and rate</span></li>
        </ol>
        <section class="onboarding__section">
          <div class="stack stack--tight">
            <h1 class="page-title">Your details</h1>
            <p class="text-secondary">These print on every invoice you send.</p>
          </div>
          <div class="field"><label class="field__label" for="o-name">Your name</label><input class="input" id="o-name" type="text" value="Mika Santos" autocomplete="name" /></div>
          <div class="field"><label class="field__label" for="o-biz">Business name</label><input class="input" id="o-biz" type="text" value="Mika Santos Studio" /><span class="field__help">Optional. Shown above your name on invoices.</span></div>
          <div class="field"><label class="field__label" for="o-email">Email</label><input class="input" id="o-email" type="email" value="mika@mikasantos.example" autocomplete="email" /></div>
          <div class="field"><label class="field__label" for="o-tin">TIN</label><input class="input" id="o-tin" type="text" placeholder="Optional" /><span class="field__help">Optional. Prints on your invoices. Orasan does not make BIR-compliant receipts.</span></div>
        </section>
        <div class="onboarding__footer">
          <span></span>
          <a class="button button--primary" href="onboarding-2.html">Continue</a>
        </div>
      </main>
    </div>
  </body>
</html>
