<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D12" />
    <title>Set up Orasan · Step 3 of 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="onboarding">
      <a class="sidebar__brand" href="index.html" aria-label="Orasan">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2" /><line x1="12" x2="15" y1="14" y2="11" /><circle cx="12" cy="14" r="8" /></svg></span>
        <span class="brand-name">orasan</span>
      </a>
      <main class="onboarding__card">
        <ol class="stepper" aria-label="Setup steps">
          <li class="stepper__step stepper__step--done"><span class="stepper__number"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span class="stepper__name">Your details</span></li>
          <li class="stepper__step stepper__step--done"><span class="stepper__number"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></span><span class="stepper__name">How you get paid</span></li>
          <li class="stepper__step stepper__step--current" aria-current="step"><span class="stepper__number">3</span><span class="stepper__name">First client and rate</span></li>
        </ol>
        <section class="onboarding__section">
          <div class="stack stack--tight">
            <h1 class="page-title">First client and rate</h1>
            <p class="text-secondary">Add one client now. You can add more from Clients.</p>
          </div>
          <div class="field"><label class="field__label" for="o-client">Client name</label><input class="input" id="o-client" type="text" value="Northwind Remote LLC" /></div>
          <div class="form-grid form-grid--2">
            <div class="field"><label class="field__label" for="o-ccur">Currency</label><select class="select" id="o-ccur"><option>USD — US dollar</option><option>PHP — Philippine peso</option></select></div>
            <div class="field"><label class="field__label" for="o-rate">Hourly rate</label><span class="input-affix"><span class="input-affix__symbol">$</span><input class="input" id="o-rate" type="text" inputmode="decimal" value="12.00" /></span></div>
          </div>
          <div class="field"><label class="field__label" for="o-project">First project</label><input class="input" id="o-project" type="text" value="VA retainer" /><span class="field__help">Time is tracked against a project.</span></div>
        </section>
        <div class="onboarding__footer">
          <a class="button button--secondary" href="onboarding-2.html">Back</a>
          <a class="button button--primary" href="timer.html">Start tracking</a>
        </div>
      </main>
    </div>
  </body>
</html>
